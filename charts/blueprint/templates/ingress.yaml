{{- range $name, $workload := .Values.workloads }}

{{- if $workload.ingress.enabled }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ $name }}-ingress

spec:
  ingressClassName: traefik

  rules:
    - host: {{ $workload.ingress.host }}
      http:
        paths:
          - path: {{ $workload.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-service
                port:
                  number: {{ $workload.service.port }}

{{- end }}

{{- end }}
